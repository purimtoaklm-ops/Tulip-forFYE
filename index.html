<style>
/* Layout: one full-bleed night-garden scene with a single tulip, and a floating bottom panel that carries the words.
   The camera (SVG viewBox) follows the growth. A single dark look by choice, so there are no light-theme overrides. */
:root {
  --bg: #17161a;
  --sky-top: #131216;
  --sky-bot: #26212a;
  --ground: #2d262f;
  --ground-hi: #3b303a;
  --stem: #94d1ab;
  --leaf-a: #b2e1c1;
  --leaf-b: #5fa87e;
  --out-a: #f4a3c1;
  --out-b: #d65f8c;
  --mid-a: #ffb8d0;
  --mid-b: #ff7aab;
  --in-a: #ffdfea;
  --in-b: #ff98bd;
  --fg: #fff1f6;
  --muted: #d3bcc6;
  --accent: #ff9fc0;
  --on-accent: #2c1620;
  --sheet: rgba(26, 24, 30, 0.84);
  --line: rgba(255, 190, 215, 0.18);
  --font-body: "Mali", "Sarabun", "Noto Sans Thai", sans-serif;
  --font-ui: "Itim", "Mali", "Sarabun", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.stage {
  position: relative;
  height: 100%;
  overflow: hidden;
  cursor: pointer;
  background: linear-gradient(var(--sky-top), var(--sky-bot));
}
.instant * { transition: none !important; }

#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* plant parts */
.stem { stroke: var(--stem); }
.lf { fill: url(#gLeaf); }
.vein { fill: none; stroke: #fff; stroke-opacity: 0.26; stroke-width: 1.6; stroke-linecap: round; }
.p1 { fill: url(#gOut); }
.p2 { fill: url(#gMid); }
.p3 { fill: url(#gIn); }
.petal { transform-origin: 0 0; transition: transform 3.4s cubic-bezier(0.25, 0.7, 0.2, 1), opacity 1.4s ease; }
.petal.active path:first-child { filter: drop-shadow(0 0 10px rgba(255, 150, 190, 0.6)); }
.zoomed .petal:not(.active) { opacity: 0.5; }
.leaf { transform-origin: 0 0; transition: transform 1.8s cubic-bezier(0.3, 0.8, 0.3, 1); }
#head { transition: opacity 1.8s ease; }
.ground { fill: url(#gGround); }
.ground-line { fill: none; stroke: #ffc0d6; stroke-opacity: 0.14; stroke-width: 1.5; }
.seed { transform-box: fill-box; transform-origin: center; transition: opacity 1.2s ease, transform 1.2s ease; }
.seed.gone { opacity: 0; transform: scale(0.3); }
.seed-body { fill: #f0c2a6; }
.seed-shine { fill: #fff2e6; fill-opacity: 0.7; }
.halo { fill: none; stroke: var(--accent); stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: halo 2.8s ease-in-out infinite; }
@keyframes halo { 0%, 100% { opacity: 0.1; transform: scale(0.8); } 50% { opacity: 0.6; transform: scale(1.15); } }

/* atmosphere */
.glow {
  position: absolute; inset: 0; pointer-events: none; opacity: 0;
  transition: opacity 3.5s ease;
  background: radial-gradient(70% 50% at 50% 38%, rgba(255, 143, 183, 0.36), rgba(255, 143, 183, 0) 70%);
}
.flies { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.fly {
  position: absolute; border-radius: 50%; background: #ffd9e6; opacity: 0;
  box-shadow: 0 0 8px 2px rgba(255, 170, 205, 0.55);
  animation: drift var(--d) ease-in-out infinite, twinkle var(--t) ease-in-out infinite;
}
@keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(var(--x), var(--y)); } }
@keyframes twinkle { 0%, 100% { opacity: 0.08; } 50% { opacity: 0.8; } }

/* panel */
.sheet {
  position: absolute; left: 0; right: 0; bottom: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.panel {
  max-width: 520px; margin: 0 auto; box-sizing: border-box;
  padding: 16px 18px 18px;
  background: var(--sheet);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 22px;
  display: flex; flex-direction: column; gap: 12px;
  pointer-events: auto;
}
.dots { display: flex; gap: 8px; justify-content: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--line); box-sizing: border-box; transition: background 0.8s ease, border-color 0.8s ease, box-shadow 0.8s ease; }
.dot.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px rgba(255, 159, 192, 0.7); }
.msg { min-height: calc(1.75em * 3); display: flex; flex-direction: column; justify-content: center; font-size: 17px; }
.txt, .sign { margin: 0; line-height: 1.75; text-align: center; text-wrap: pretty; opacity: 0; transform: translateY(6px); transition: opacity 0.5s ease, transform 0.5s ease; }
.sign { font-family: var(--font-ui); color: var(--accent); text-align: right; margin-top: 4px; }
.txt.show, .sign.show { opacity: 1; transform: none; transition-duration: 0.9s; }
.btn {
  appearance: none; border: 0; cursor: pointer;
  height: 48px; width: 100%; border-radius: 999px;
  background: var(--accent); color: var(--on-accent);
  font-family: var(--font-ui); font-size: 19px; letter-spacing: 0.02em;
  transition: opacity 0.4s ease, transform 0.15s ease, filter 0.2s ease;
}
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: scale(0.98); }
.btn[aria-disabled="true"] { opacity: 0.4; cursor: default; }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

@media (max-width: 520px) { .msg { min-height: calc(1.75em * 4); } }
@media (prefers-reduced-motion: reduce) {
  .petal, .leaf, #head { transition-duration: 0.4s !important; }
  .fly { animation: none; opacity: 0.3; }
  .halo { animation: none; opacity: 0.4; }
}
</style>

<div class="stage" id="stage">

</div>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var seed = document.getElementById('seed');
  var glow = document.getElementById('glow');
  var flies = document.getElementById('flies');
  var dotsEl = document.getElementById('dots');
  var txt = document.getElementById('txt');

  var L = stem.getTotalLength();

    mk('path', { d: VEIN, 'class': 'vein' }, g);
    g.style.transform = tf(a * 0.2, 0.6);
    return g;
  });

    { f: 0.08, rot: -118, k: 0.4, step: 1 }, { f: 0.08, rot: -62, k: 0.4, step: 1 },
    { f: 0.20, rot: -128, k: 0.75, step: 2 }, { f: 0.26, rot: -54, k: 0.8, step: 2 },
    { f: 0.36, rot: -116, k: 1.0, step: 3 }, { f: 0.44, rot: -64, k: 1.0, step: 3 }, { f: 0.56, rot: -126, k: 0.65, step: 3 }
  ];
  function setLeaf(d, on) {

    var p = stem.getPointAtLength(d.f * L);

  });

  var dots = [];
  for (var i = 0; i < 6; i++) { var s = document.createElement('span'); s.className = 'dot'; dotsEl.appendChild(s); dots.push(s); }

  /* fireflies */

    var f = document.createElement('span');
    var size = 3 + Math.random() * 3;
    f.className = 'fly';
    f.style.left = (Math.random() * 100) + '%';
    f.style.top = (Math.random() * 90) + '%';
    f.style.width = f.style.height = size + 'px';
    f.style.setProperty('--x', (Math.random() * 60 - 30) + 'px');
    f.style.setProperty('--y', (Math.random() * 60 - 30) + 'px');
    f.style.setProperty('--d', (7 + Math.random() * 8) + 's');
    f.style.setProperty('--t', (3 + Math.random() * 4) + 's');
    f.style.animationDelay = (-Math.random() * 8) + 's, ' + (-Math.random() * 6) + 's';

  }

  /* camera */
  function aspect() {
    var r = svg.getBoundingClientRect();

    var a = aspect();
    function c(cx, cy, h, fy, minW) { return { cx: cx, cy: cy, h: Math.max(h, (minW || 0) / a), fy: fy }; }

    if (n === 3) return c(200, 440, 640, 0.40, 330);

  function ease(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }

    cancelAnimationFrame(raf);

  for (var q = 0; q <= NB; q++) {
    var bp = stem.getPointAtLength(L * q / NB);

  }

    if (instant) stage.classList.add('instant');

    var frFrom = FR[Math.min(from, 3)], frTo = FR[Math.min(n, 3)];
    stem.style.transition = instant ? 'none' : 'stroke-dashoffset ' + Math.round(dur * 0.92) + 'ms ease-in-out';
    stem.style.strokeDashoffset = L * (1 - frTo);

    seed.classList.toggle('gone', n > 0);

    LEAVES.forEach(function (d) {
      var on = n >= d.step, delay = 0;
      if (on && from < d.step && frTo > frFrom) delay = Math.max(0, (d.f - frFrom) / (frTo - frFrom)) * dur * 0.8;
      d.el.style.transitionDelay = Math.round(delay) + 'ms';
      setLeaf(d, on);
    });

    head.style.transitionDelay = (n >= 3 && from < 3) ? Math.round(dur * 0.6) + 'ms' : '0ms';
    head.style.opacity = n >= 3 ? 1 : 0;

    petals.forEach(function (g, i) {
      var open = n >= 4 + i;
      g.style.transitionDelay = open ? '250ms' : '0ms';
      g.style.transform = open ? tf(OPEN_A[i], OPEN_S[i]) : tf(OPEN_A[i] * 0.2, 0.6);
      g.classList.toggle('active', n === 4 + i);
    });
    svg.classList.toggle('zoomed', n >= 4 && n <= 9);

    glow.style.opacity = n < 4 ? 0 : n >= 10 ? 1 : 0.12 + 0.1 * (n - 4);

    var opened = Math.max(0, Math.min(6, n - 3));
    dots.forEach(function (d, i) { d.classList.toggle('on', i < opened); });
    dotsEl.setAttribute('aria-label', 'กลีบที่บานแล้ว ' + opened + ' จาก 6');

    if (instant) { cam = camFor(n); apply(cam); } else { tweenTo(camFor(n), dur); }

    clearTimeout(tTimer); clearTimeout(uTimer);
    if (!keepText) { txt.classList.remove('show'); sign.classList.remove('show'); }
    lock = true;
    btn.setAttribute('aria-disabled', 'true');

    tTimer = setTimeout(function () {
      btn.textContent = STEPS[n].b;
      if (keepText) return;
      txt.textContent = STEPS[n].t;
      sign.hidden = !STEPS[n].sign;
      requestAnimationFrame(function () {
        txt.classList.add('show');
        if (STEPS[n].sign) sign.classList.add('show');
      });
    }, instant ? 0 : Math.round(dur * (keepText ? 0.5 : 0.62)));

    if (n >= 10) startSway();

    uTimer = setTimeout(function () {
      lock = false;
      btn.removeAttribute('aria-disabled');
    }, instant ? 0 : dur);

    if (instant) {
      void stage.offsetWidth;
      requestAnimationFrame(function () { stage.classList.remove('instant'); });
    }
  }

  document.addEventListener('click', function () {
    if (lock) return;
    goTo(cur === 10 ? 11 : cur === 11 ? 10 : cur + 1, false);
  });

  function onResize() { if (!tweening) { cam = camFor(cur); apply(cam); } }
  if ('ResizeObserver' in window) new ResizeObserver(onResize).observe(stage);
  else window.addEventListener('resize', onResize);

  goTo(0, true);
})();
</script>
